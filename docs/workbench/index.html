<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目知识工作台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<aside class="sidebar">
  <a class="brand" href="#today"><span class="brand-mark">◈</span><span>开发手记<small>游戏项目知识工作台</small></span></a>
  <div class="project-card"><span class="tiny">当前项目</span><strong id="project-name">读取资料中…</strong><span><i class="dot"></i> 本地 Markdown 工作空间</span></div>
  <div class="nav-label">游戏 Wiki</div>
  <nav class="wiki-nav">
    <a href="#wiki-units" data-nav="wiki-units"><span>⚔</span>单位</a>
    <a href="#wiki-skills" data-nav="wiki-skills"><span>✦</span>技能</a>
    <a href="#wiki-buildings" data-nav="wiki-buildings"><span>⌂</span>建筑</a>
    <a href="#wiki-tags" data-nav="wiki-tags"><span>#</span>标签</a>
    <a href="#wiki-resources" data-nav="wiki-resources"><span>◇</span>资源</a>
    <a href="#wiki-levels" data-nav="wiki-levels"><span>▦</span>关卡</a>
    <a href="#wiki-adventures" data-nav="wiki-adventures"><span>✧</span>冒险事件</a>
    <a href="#wiki-names" data-nav="wiki-names"><span>Aa</span>命名 <small>低优先级</small></a>
  </nav>
  <div class="nav-label planning-label">游戏制作</div>
  <nav class="planning-nav">
    <a href="#today" data-nav="today"><span>◷</span>制作总览</a>
    <a href="#tasks" data-nav="tasks"><span>☑</span>待办与问题</a>
    <a href="#ideas" data-nav="ideas"><span>✧</span>新想法</a>
    <a href="#journal" data-nav="journal"><span>▦</span>每日日志</a>
    <a href="#graph" data-nav="graph"><span>⌘</span>关联地图</a>
  </nav>
  <div class="sidebar-bottom"><a href="#library">全部资料与归档 <span>↗</span></a><button id="refresh">↻ 刷新资料</button><span>本地 Markdown 工作空间<br>你与助手共用同一份 MD</span></div>
</aside>
<div class="shell"><header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <strong id="crumb">今日工作台</strong></div><div class="top-actions"><span class="local-badge"><i class="dot"></i> 本地连接</span><button id="search-open" class="search-trigger">⌕ 搜索资料 <kbd>/</kbd></button></div></header>
<main id="main"><div class="empty">正在读取项目 Markdown…</div></main>
<footer>游戏 Wiki <span>·</span> 配置总览 <span>·</span> 制作统筹</footer></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="search-dialog"><div class="dialog-head"><h2>搜索项目资料</h2><button data-close>×</button></div><input id="search-input" placeholder="搜索标题、正文、编号…" aria-label="搜索项目资料"><div id="search-results"></div></dialog>
<dialog id="source-dialog"><div class="dialog-head"><h2 id="source-title">文件预览</h2><button data-close>×</button></div><div id="source-content"></div></dialog>
<dialog id="create-dialog"><div class="dialog-head"><h2>记录新事项</h2><button data-close>×</button></div><form id="create-form"><label>类型<select name="kind"><option value="task">任务</option><option value="issue">问题</option><option value="idea">新想法</option></select></label><div id="idea-group-field" hidden><span>大类</span><div id="idea-groups" class="idea-group-buttons" role="group" aria-label="选择大类"></div><input name="idea_group" type="hidden"><label>新大类<input name="new_idea_group" maxlength="40" placeholder="未选择上方按钮时，输入新的大类名称"></label></div><label>标题<input name="title" required maxlength="80" placeholder="这件事要解决什么？"></label><label>内容<textarea name="details" rows="5" placeholder="描述想法、目标或出现条件"></textarea></label><button class="primary" type="submit">保存记录</button></form></dialog>
<script src="/app.js"></script>
</body></html>
